<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications — Student Task Manager</title>
    
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="codestyle.css">
</head>

<body class="page-reminder">
    <!-- Animated Ambient Glass Orbs (Emerald & Gold Aurora) -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <div class="container">

<h1>🔔 Notifications</h1>

<p class="subtitle">
Upcoming task reminders and deadlines
</p>

<div class="notification-list">

<div class="notification high">

<div class="left">

<div class="icon">
⚠️
</div>

<div class="message">

<h3>Java Assignment Due Soon</h3>

<p>
Complete your Java OOP assignment before tomorrow.
</p>

</div>

</div>

<div class="time">
1 hour ago
</div>

</div>


<div class="notification medium">

<div class="left">

<div class="icon">
📚
</div>

<div class="message">

<h3>Database Quiz Reminder</h3>

<p>
Database quiz scheduled in 2 days.
</p>

</div>

</div>

<div class="time">
Today
</div>

</div>


<div class="notification low">

<div class="left">

<div class="icon">
📝
</div>

<div class="message">

<h3>Mini Project Review</h3>

<p>
Prepare documents for project review.
</p>

</div>

</div>

<div class="time">
Tomorrow
</div>

</div>

</div>

<div class="exit">

<button onclick="goBack()">
← Exit to Dashboard
</button>

</div>

</div>

<script>

function goBack(){

window.location="Dashboard.html";

}

</script>

</body>

</html>
