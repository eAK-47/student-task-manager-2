<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager — Student Task Manager</title>
    
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="codestyle.css">
</head>

<body class="page-task">
    <!-- Animated Ambient Glass Orbs (Emerald & Gold Aurora) -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <div class="container">

<h1>📋 Student Tasks</h1>

<div class="task-form">

<input
type="text"
id="taskInput"
placeholder="Enter task">

<select id="priority">

<option>High</option>
<option>Medium</option>
<option>Low</option>

</select>

<input
type="date"
id="date">

<button
class="add-btn"
onclick="addTask()">

Add Task

</button>

</div>

<div
class="task-list"
id="taskList">

</div>

<div class="exit">

<button onclick="goBack()">

← Exit to Dashboard

</button>

</div>

</div>

<script>
    // Load tasks from localStorage or return defaults
    function getTasks() {
        let stored = localStorage.getItem("studentTasks");
        if (stored) {
            return JSON.parse(stored);
        }
        // Default tasks if empty
        let defaultTasks = [
            { title: "UID Project Implementation Plan", priority: "High", date: "2026-06-03", completed: false },
            { title: "Database Assignment 3", priority: "Medium", date: "2026-06-05", completed: false },
            { title: "Java Coding Exercises", priority: "Low", date: "2026-06-10", completed: true }
        ];
        localStorage.setItem("studentTasks", JSON.stringify(defaultTasks));
        return defaultTasks;
    }

    // Save tasks to localStorage
    function saveTasks(tasks) {
        localStorage.setItem("studentTasks", JSON.stringify(tasks));
    }

    // Render task items
    function renderTasks() {
        let tasks = getTasks();
        let listDiv = document.getElementById("taskList");
        listDiv.innerHTML = "";

        if (tasks.length === 0) {
            listDiv.innerHTML = `<div class="task" style="text-align: center; color: var(--text-gray); display: block; padding: 32px 24px;">No tasks found. Add a task above to get started!</div>`;
            return;
        }

        tasks.forEach((task, index) => {
            let colorClass = task.priority.toLowerCase();
            let statusText = task.completed ? "Completed" : "Pending";
            let statusBadgeClass = task.completed ? "background: rgba(52, 211, 153, 0.1); color: var(--success); border: 1px solid rgba(52, 211, 153, 0.2);" : "background: rgba(245, 158, 11, 0.1); color: var(--accent-gold); border: 1px solid rgba(245, 158, 11, 0.2);";
            
            let card = document.createElement("div");
            card.className = "task";
            card.style.opacity = task.completed ? "0.75" : "1";
            
            card.innerHTML = `
                <div class="task-left">
                    <h3 style="text-decoration: ${task.completed ? 'line-through' : 'none'}; color: ${task.completed ? 'var(--text-gray)' : 'var(--text-white)'}">${task.title}</h3>
                    <div class="details">
                        <span class="priority ${colorClass}">${task.priority}</span>
                        <span>📅 ${task.date || "No due date"}</span>
                        <span style="padding: 2px 8px; border-radius: 50px; font-size: 11px; font-weight: 600; ${statusBadgeClass}">${statusText}</span>
                    </div>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="add-btn" style="padding: 8px 16px; font-size: 13px; background: ${task.completed ? 'rgba(255,255,255,0.05)' : 'var(--primary)'}; border: ${task.completed ? '1px solid rgba(255,255,255,0.1)' : 'none'}; color: ${task.completed ? 'var(--text-gray)' : 'white'}" onclick="toggleStatus(${index})">
                        ${task.completed ? "↩ Undo" : "✓ Complete"}
                    </button>
                    <button class="delete" onclick="deleteTask(${index})">Delete</button>
                </div>
            `;
            listDiv.appendChild(card);
        });
    }

    // Add new task
    function addTask() {
        let title = document.getElementById("taskInput").value.trim();
        let priority = document.getElementById("priority").value;
        let date = document.getElementById("date").value;

        if (title === "") {
            alert("Please enter a task description.");
            return;
        }

        let tasks = getTasks();
        tasks.push({ title, priority, date, completed: false });
        saveTasks(tasks);
        renderTasks();

        // Clear inputs
        document.getElementById("taskInput").value = "";
    }

    // Delete task
    function deleteTask(index) {
        if (confirm("Are you sure you want to delete this task?")) {
            let tasks = getTasks();
            tasks.splice(index, 1);
            saveTasks(tasks);
            renderTasks();
        }
    }

    // Toggle complete/pending status
    function toggleStatus(index) {
        let tasks = getTasks();
        tasks[index].completed = !tasks[index].completed;
        saveTasks(tasks);
        renderTasks();
    }

    function goBack() {
        window.location.href = "Dashboard.html";
    }

    // Initial render
    renderTasks();
</script>
</body>
</html>
