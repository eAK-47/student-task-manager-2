<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress — Student Task Manager</title>
    
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="codestyle.css">
</head>

<body class="page-progress">
    <!-- Animated Ambient Glass Orbs (Emerald & Gold Aurora) -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <div class="container">

        <h1>📊 Progress Overview</h1>

        <div class="cards">
            <div class="card">
                <h3>Total Tasks</h3>
                <div class="number" id="statTotal">0</div>
            </div>

            <div class="card">
                <h3>Completed</h3>
                <div class="number" id="statCompleted" style="color: var(--success);">0</div>
            </div>

            <div class="card">
                <h3>Pending</h3>
                <div class="number" id="statPending" style="color: var(--accent-gold);">0</div>
            </div>

            <div class="card">
                <h3>Performance</h3>
                <div class="number" id="statPerformance">0%</div>
            </div>
        </div>

        <div class="progress-container">
            <h2>Task Completion Progress</h2>
            <br>
            <div class="progress-bar">
                <div class="progress" id="statProgressBar" style="width: 0%;"></div>
            </div>
        </div>

        <div class="exit">
            <button onclick="goBack()">← Exit to Dashboard</button>
        </div>

    </div>

    <script>
        function loadProgress() {
            let storedTasks = localStorage.getItem("studentTasks");
            let tasks = storedTasks ? JSON.parse(storedTasks) : [
                { title: "UID Project Implementation Plan", priority: "High", date: "2026-06-03", completed: false },
                { title: "Database Assignment 3", priority: "Medium", date: "2026-06-05", completed: false },
                { title: "Java Coding Exercises", priority: "Low", date: "2026-06-10", completed: true }
            ];
            
            let total = tasks.length;
            let completed = tasks.filter(t => t.completed).length;
            let pending = total - completed;
            let performance = total > 0 ? Math.round((completed / total) * 100) : 0;
            
            document.getElementById("statTotal").textContent = total;
            document.getElementById("statCompleted").textContent = completed;
            document.getElementById("statPending").textContent = pending;
            document.getElementById("statPerformance").textContent = performance + "%";
            document.getElementById("statProgressBar").style.width = performance + "%";
        }

        function goBack() {
            window.location.href = "Dashboard.html";
        }

        loadProgress();
    </script>

</body>
</html>
